name: Brand foundation checks
on:
  pull_request:
  push:
    branches: [rebrand/cohnsoft]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/build-preview.mjs
      - run: node --test test/*.test.mjs
      - run: git diff --exit-code -- docs/brand-preview-light.html docs/brand-preview-dark.html
